<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orion Dijital — Apps</title>
<meta name="description" content="Apps by Orion Dijital. WhatsApp tools, app analytics, Instagram automation and more on Google Play and the App Store.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16;
  --bg2:#0b1224;
  --card:#111a30;
  --card-hover:#15203c;
  --line:rgba(255,255,255,0.08);
  --txt:#eef2fb;
  --muted:#8a96b3;
  --acc1:#2ee6a8;
  --acc2:#37a0ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Sora',sans-serif;background:var(--bg);color:var(--txt);
  overflow-x:hidden;line-height:1.6;
}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(700px 500px at 15% -5%, rgba(46,230,168,0.14), transparent 60%),
   radial-gradient(800px 600px at 100% 10%, rgba(55,160,255,0.13), transparent 55%),
   radial-gradient(600px 600px at 50% 120%, rgba(55,160,255,0.08), transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 24px}

/* header */
header{padding:90px 0 50px;text-align:center}
.brand-badge{display:inline-flex;align-items:center;gap:10px;
  padding:8px 16px;border:1px solid var(--line);border-radius:100px;
  background:rgba(255,255,255,0.03);font-family:'Space Grotesk';
  font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:30px}
.brand-badge .dot{width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:0 0 12px var(--acc1)}
h1{font-size:clamp(38px,7vw,68px);font-weight:800;letter-spacing:-2px;line-height:1.05}
h1 .grad{background:linear-gradient(110deg,var(--acc1),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:22px auto 0;max-width:520px;color:var(--muted);font-size:17px}
.stats{display:flex;gap:38px;justify-content:center;margin-top:42px;flex-wrap:wrap}
.stat .n{font-family:'Space Grotesk';font-size:30px;font-weight:700;
  background:linear-gradient(110deg,var(--acc1),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding:30px 0 80px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{position:relative;border:1px solid var(--line);border-radius:24px;
  background:linear-gradient(160deg,var(--card),var(--bg2));
  padding:26px;overflow:hidden;transition:.35s cubic-bezier(.2,.7,.3,1);
  opacity:0;transform:translateY(24px)}
.card.show{opacity:1;transform:none}
.card::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1px;
  background:linear-gradient(140deg,rgba(46,230,168,.4),transparent 40%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.35s}
.card:hover{transform:translateY(-6px);background:linear-gradient(160deg,var(--card-hover),var(--bg2));
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
.card:hover::before{opacity:1}
.card-top{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.icon{width:74px;height:74px;border-radius:18px;flex-shrink:0;object-fit:cover;
  box-shadow:0 8px 24px rgba(0,0,0,.45);border:1px solid var(--line)}
.card-name{font-size:20px;font-weight:700;letter-spacing:-.4px}
.card-tag{font-size:13.5px;color:var(--muted);margin-top:3px}
.desc{font-size:14.5px;color:var(--muted);min-height:44px;margin-bottom:20px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;flex:1;justify-content:center;
  min-width:130px;padding:12px 14px;border-radius:13px;text-decoration:none;
  font-size:14px;font-weight:600;transition:.25s;border:1px solid var(--line)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-play{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#04121d;border:none}
.btn-play:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn-ios{background:rgba(255,255,255,0.04);color:var(--txt)}
.btn-ios:hover{background:rgba(255,255,255,0.09);transform:translateY(-2px)}

/* footer */
footer{border-top:1px solid var(--line);padding:46px 0 60px;text-align:center;color:var(--muted)}
footer .links{display:flex;gap:24px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
footer a{color:var(--muted);text-decoration:none;font-size:14px;transition:.2s}
footer a:hover{color:var(--acc1)}
footer .cc{font-size:13px;opacity:.7}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrap">

  <header>
    <div class="brand-badge"><span class="dot"></span>Orion Dijital</div>
    <h1>Apps we <span class="grad">build & ship</span></h1>
    <p class="sub">A growing portfolio of mobile tools for creators, developers and businesses, available on Google Play and the App Store.</p>
    <div class="stats">
      <div class="stat"><div class="n">7</div><div class="l">Apps</div></div>
      <div class="stat"><div class="n">2</div><div class="l">Stores</div></div>
      <div class="stat"><div class="n">25+</div><div class="l">Languages</div></div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    <div class="links">
      <a href="support.html">Support</a>
    </div>
    <div class="cc">© <span id="yr"></span> Orion Dijital. All rights reserved.</div>
  </footer>

</div>

<script>
const PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 2.3c-.3.3-.5.7-.5 1.3v16.8c0 .6.2 1 .5 1.3l.1.1L13 12.6v-.2L3.7 2.2l-.1.1z"/><path d="M16.3 15.9 13 12.6v-.2l3.3-3.3.1.1 3.9 2.2c1.1.6 1.1 1.7 0 2.3l-3.9 2.2h-.1z"/><path d="m16.4 15.8-3.4-3.4L3.6 21.8c.4.4 1 .4 1.7 0l11.1-6z" opacity=".85"/><path d="M16.4 8.2 5.3 2.2c-.7-.4-1.3-.4-1.7 0l9.4 9.4 3.4-3.4z" opacity=".7"/></svg>`;
const APPLE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.8-2.7-.7-1.4 0-2.6.8-3.3 2-1.4 2.5-.4 6.1 1 8.1.7 1 1.5 2.1 2.5 2 1-.04 1.4-.6 2.6-.6s1.5.6 2.6.6c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.02-.01-2.1-.8-2.1-3.2zM14.5 6.2c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.06 1.8-.4 2.3-1.1z"/></svg>`;

const apps = [
  {name:"App Revenue Downloads Tracker", tag:"App analytics & revenue estimates", desc:"Estimate the revenue, downloads and rankings of any app in seconds.", icon:"icons/apprevenue.png",
   play:"https://play.google.com/store/apps/details?id=com.apprevenue.tracker", ios:"https://apps.apple.com/us/app/app-revenue-downloads-tracker/id6777227914"},
  {name:"WABot AI ChatBot Auto Reply", tag:"WhatsApp Business AI assistant", desc:"Automate WhatsApp replies with an AI chatbot powered by the official API.", icon:"icons/wabot.png",
   play:"https://play.google.com/store/apps/details?id=com.wabot.ai.assistant", ios:"https://apps.apple.com/us/app/wabot-ai-chatbot-auto-reply/id6759197182"},
  {name:"InstaReply — Auto Reply for IG", tag:"Instagram DM & comment automation", desc:"Auto-reply to Instagram comments and DMs with smart rules.", icon:"icons/instareply.jpg",
   play:"https://play.google.com/store/apps/details?id=app.instareply.auto", ios:"https://apps.apple.com/us/app/instareply-auto-reply-for-ig/id6768798126"},
  {name:"Waon Online Tracker Last Seen", tag:"WhatsApp online tracker", desc:"Track online status and last seen activity with detailed reports.", icon:"icons/waon.jpg",
   play:"https://play.google.com/store/apps/details?id=wa.waon.onlinetracker", ios:"https://apps.apple.com/us/app/waon-online-tracker-last-seen/id6667119774"},
  {name:"OnWa Last Seen Chat Tracker", tag:"WhatsApp online tracker", desc:"Monitor online and last seen activity with clean, simple analytics.", icon:"icons/onwa.png",
   play:"https://play.google.com/store/apps/details?id=onwa.lastseen.chat.tracker", ios:"https://apps.apple.com/us/app/onwa-last-seen-chat-tracker/id6751362929"},
  {name:"Dua Widget — Ayah & Hadith", tag:"Islamic prayer & widgets", desc:"Daily duas, ayah and hadith with home screen widgets and a tasbih counter.", icon:"icons/duawidget.png",
   play:"https://play.google.com/store/apps/details?id=com.duawidget.app", ios:null},
  {name:"GameHUD Ping Stats & Crosshair", tag:"Gaming overlay & FPS tools", desc:"On-screen ping, FPS stats and a custom crosshair overlay for gamers.", icon:"icons/gamehud.png",
   play:"https://play.google.com/store/apps/details?id=com.gamehud.overlay.monitor", ios:null},
];

const grid = document.getElementById('grid');
apps.forEach((a,i)=>{
  const card = document.createElement('div');
  card.className='card';
  card.style.transitionDelay=(i*70)+'ms';
  let btns = `<a class="btn btn-play" href="${a.play}" target="_blank" rel="noopener">${PLAY}Google Play</a>`;
  if(a.ios) btns += `<a class="btn btn-ios" href="${a.ios}" target="_blank" rel="noopener">${APPLE}App Store</a>`;
  card.innerHTML = `
    <div class="card-top">
      <img class="icon" src="${a.icon}" alt="${a.name} icon" loading="lazy">
      <div><div class="card-name">${a.name}</div><div class="card-tag">${a.tag}</div></div>
    </div>
    <div class="desc">${a.desc}</div>
    <div class="btns">${btns}</div>`;
  grid.appendChild(card);
});

// reveal on scroll
const io = new IntersectionObserver((es)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('show'); io.unobserve(e.target);} });
},{threshold:.15});
document.querySelectorAll('.card').forEach(c=>io.observe(c));

document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
