<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Orion Dijital</title>
<meta name="description" content="Get support for Orion Dijital apps. Contact the team for each app directly by email.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16;--bg2:#0b1224;--card:#111a30;--card-hover:#15203c;
  --line:rgba(255,255,255,0.08);--txt:#eef2fb;--muted:#8a96b3;
  --acc1:#2ee6a8;--acc2:#37a0ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;line-height:1.6}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(700px 500px at 15% -5%, rgba(46,230,168,0.14), transparent 60%),
   radial-gradient(800px 600px at 100% 10%, rgba(55,160,255,0.13), transparent 55%)}
.wrap{position:relative;z-index:1;max-width:840px;margin:0 auto;padding:0 24px}
header{padding:80px 0 40px;text-align:center}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;
  font-size:14px;margin-bottom:30px;transition:.2s}
.back:hover{color:var(--acc1)}
.brand-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid var(--line);
  border-radius:100px;background:rgba(255,255,255,0.03);font-family:'Space Grotesk';
  font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
.brand-badge .dot{width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:0 0 12px var(--acc1)}
h1{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1.08}
h1 .grad{background:linear-gradient(110deg,var(--acc1),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:20px auto 0;max-width:520px;color:var(--muted);font-size:16px}
.list{display:flex;flex-direction:column;gap:14px;padding:20px 0 50px}
.row{display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(160deg,var(--card),var(--bg2));padding:18px 20px;transition:.3s;text-decoration:none}
.row:hover{transform:translateY(-3px);background:linear-gradient(160deg,var(--card-hover),var(--bg2));
  box-shadow:0 16px 40px rgba(0,0,0,.4)}
.row .ic{width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0;
  border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.row .info{flex:1;min-width:0}
.row .nm{font-size:16.5px;font-weight:700;color:var(--txt)}
.row .em{font-size:14px;color:var(--acc1);margin-top:2px;word-break:break-all}
.row .arrow{color:var(--muted);font-size:20px;flex-shrink:0;transition:.3s}
.row:hover .arrow{color:var(--acc1);transform:translateX(4px)}
.note{text-align:center;color:var(--muted);font-size:14px;max-width:560px;margin:0 auto 60px;
  border-top:1px solid var(--line);padding-top:30px}
footer{border-top:1px solid var(--line);padding:36px 0 50px;text-align:center;color:var(--muted)}
footer .cc{font-size:13px;opacity:.7}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrap">

  <header>
    <a class="back" href="index.html">← All apps</a>
    <div class="brand-badge"><span class="dot"></span>Orion Dijital</div>
    <h1>How can we <span class="grad">help?</span></h1>
    <p class="sub">Choose the app you need help with and email the team directly. We usually reply within 1–2 business days.</p>
  </header>

  <div class="list" id="list"></div>

  <p class="note">Please include your device model, OS version and a short description of the issue so we can help you faster.</p>

  <footer>
    <div class="cc">© <span id="yr"></span> Orion Dijital. All rights reserved.</div>
  </footer>

</div>

<script>
const apps = [
  {name:"App Revenue Downloads Tracker", icon:"icons/apprevenue.png", mail:"app.revenue.tr@gmail.com"},
  {name:"WABot AI ChatBot Auto Reply", icon:"icons/wabot.png", mail:"support@wabotai.com"},
  {name:"InstaReply — Auto Reply for IG", icon:"icons/instareply.jpg", mail:"instareplyapp@gmail.com"},
  {name:"Waon Online Tracker Last Seen", icon:"icons/waon.jpg", mail:"appwaon@gmail.com"},
  {name:"OnWa Last Seen Chat Tracker", icon:"icons/onwa.png", mail:"onwaapp@gmail.com"},
  {name:"Dua Widget — Ayah & Hadith", icon:"icons/duawidget.png", mail:"duawidget@gmail.com"},
];
const list = document.getElementById('list');
apps.forEach(a=>{
  const row = document.createElement('a');
  row.className='row';
  row.href='mailto:'+a.mail;
  row.innerHTML = `
    <img class="ic" src="${a.icon}" alt="${a.name} icon" loading="lazy">
    <div class="info"><div class="nm">${a.name}</div><div class="em">${a.mail}</div></div>
    <div class="arrow">→</div>`;
  list.appendChild(row);
});
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
